<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experience | Advait Mehendale</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div id="particles-js"></div>

    <nav class="navbar navbar-expand-lg sticky-top custom-navbar">
        <div class="container">
            <a class="navbar-brand signature-font" style="color: white;" href="index.html">AM</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html#projects">Projects</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="experience.html">Experience</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="publications.html">Publications</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="contact.html">Contact Me</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <h3 class="mb-5 text-center signature-font">Experience</h3>

        <div class="d-flex flex-column gap-4" id="experience-list"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script src="data.js"></script>
    <script src="js/particles-config.js"></script>
    <script>
        const list = document.getElementById('experience-list');
        if (!SITE_DATA.experience.length) {
            list.innerHTML = '<div class="glass-card p-5 text-center"><p class="text-secondary mb-0">No experience entries added yet.</p></div>';
        } else {
            list.innerHTML = SITE_DATA.experience.map(e => `
                <div class="glass-card p-4 pub-card">
                    <div class="row align-items-center">
                        <div class="col-md-3 mb-3 mb-md-0">
                            <span class="badge pub-type-badge mb-2">
                                <i class="fas fa-briefcase me-1"></i>${e.role}
                            </span>
                            <h5 class="fw-bold mb-1">${e.name}</h5>
                            ${e.duration ? `<p class="text-secondary small mb-0"><i class="fas fa-calendar-alt me-1"></i>${e.duration}</p>` : ''}
                        </div>
                        <div class="col-md-9">
                            <p class="small mb-0" style="color: var(--text-main);">${e.description}</p>
                        </div>
                    </div>
                </div>`).join('');
        }
    </script>

</body>

</html>
