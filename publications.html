<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publications | Advait Mehendale</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div id="particles-js"></div>

    <nav class="navbar navbar-expand-lg sticky-top custom-navbar">
        <div class="container">
            <a class="navbar-brand signature-font" style="color: white;" href="index.html">AM</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html#projects">Projects</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="experience.html">Experience</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="publications.html">Publications</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="contact.html">Contact Me</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <h3 class="mb-5 text-center signature-font">Publications</h3>

        <div class="d-flex flex-column gap-4" id="publications-list"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.dots.min.js"></script>
    <script src="data.js"></script>
    <script src="js/vanta-config.js"></script>
    <script>
        const list = document.getElementById('publications-list');
        if (!SITE_DATA.publications.length) {
            list.innerHTML = '<div class="glass-card p-5 text-center"><p class="text-secondary mb-0">No publications added yet.</p></div>';
        } else {
            list.innerHTML = SITE_DATA.publications.map(p => `
                <div class="glass-card p-4 pub-card">
                    <div class="row align-items-center">
                        <div class="col-md-4 mb-3 mb-md-0">
                            <span class="badge pub-type-badge mb-2">${p.type}</span>
                            <h5 class="fw-bold mb-1">${p.title}</h5>
                            <p class="text-secondary small mb-1">${p.authors}</p>
                            <p class="text-secondary small mb-0">
                                <i class="fas fa-calendar-alt me-1"></i>${p.year}
                                ${p.venue ? `&nbsp;·&nbsp;<i class="fas fa-book-open me-1"></i>${p.venue}` : ''}
                            </p>
                        </div>
                        <div class="col-md-6 mb-3 mb-md-0">
                            <p class="small mb-0" style="color: var(--text-main);">${p.abstract}</p>
                        </div>
                        <div class="col-md-2 text-md-end">
                            ${p.link ? `<a href="${p.link}" target="_blank" class="btn btn-pastel btn-sm"><i class="fas fa-external-link-alt me-1"></i>View</a>` : ''}
                        </div>
                    </div>
                </div>`).join('');
        }
    </script>

    <script src="js/cursor.js"></script>
</body>

</html>
